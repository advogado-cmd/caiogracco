<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    

    <radialGradient id="bgLight" cx="26%" cy="46%" r="60%">
      <stop offset="0" stop-color="#FDF8ED"></stop>
      <stop offset="0.42" stop-color="#F7EEDB"></stop>
      <stop offset="1" stop-color="#F7EEDB" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bgBase" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#F2E6CE"></stop>
      <stop offset="0.58" stop-color="#E4D2B2"></stop>
      <stop offset="1" stop-color="#D3BC96"></stop>
    </radialGradient>
    <linearGradient id="bgTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B89C6F" stop-opacity="0.32"></stop>
      <stop offset="0.3" stop-color="#B89C6F" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="bgFloor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#96794E" stop-opacity="0.34"></stop>
      <stop offset="0.26" stop-color="#96794E" stop-opacity="0.06"></stop>
      <stop offset="0.46" stop-color="#96794E" stop-opacity="0"></stop>
    </linearGradient>

    <linearGradient id="fgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8DC9C"></stop>
      <stop offset="1" stop-color="#D89B2A"></stop>
    </linearGradient>
    <linearGradient id="fgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C1841D"></stop>
      <stop offset="1" stop-color="#8C5B0F"></stop>
    </linearGradient>
    <linearGradient id="frL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B4CC"></stop>
      <stop offset="1" stop-color="#C55388"></stop>
    </linearGradient>
    <linearGradient id="frD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A93C6F"></stop>
      <stop offset="1" stop-color="#77234B"></stop>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E289AE"></stop>
      <stop offset="0.6" stop-color="#C55388"></stop>
      <stop offset="1" stop-color="#9E3467"></stop>
    </linearGradient>
    <linearGradient id="core" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F4D07A"></stop>
      <stop offset="0.5" stop-color="#DDA436"></stop>
      <stop offset="1" stop-color="#BC821E"></stop>
    </linearGradient>
    <linearGradient id="nameBlue" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#24487F"></stop>
      <stop offset="0.38" stop-color="#16305F"></stop>
      <stop offset="0.68" stop-color="#0D1A4A"></stop>
      <stop offset="1" stop-color="#071033"></stop>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1.2" dy="2.2" stdDeviation="2.4" flood-color="#6D5119" flood-opacity="0.32"></feDropShadow>
    </filter>

    <g id="ribLongG"><rect x="110.1" y="20" width="1.9" height="50" fill="url(#fgL)"></rect><rect x="112" y="21.4" width="1.9" height="48.6" fill="url(#fgD)"></rect></g>
    <g id="ribShortG"><rect x="110.1" y="38" width="1.9" height="32" fill="url(#fgL)"></rect><rect x="112" y="39.2" width="1.9" height="30.8" fill="url(#fgD)"></rect></g>
    <g id="ribLongR"><rect x="110.1" y="20" width="1.9" height="50" fill="url(#frL)"></rect><rect x="112" y="21.4" width="1.9" height="48.6" fill="url(#frD)"></rect></g>
    <g id="ribShortR"><rect x="110.1" y="38" width="1.9" height="32" fill="url(#frL)"></rect><rect x="112" y="39.2" width="1.9" height="30.8" fill="url(#frD)"></rect></g>

    <g id="sun">
      <circle cx="100" cy="100" r="96" fill="none" stroke="url(#ring)" stroke-width="1.4"></circle>
      <g filter="url(#soft)">
        <use href="#ribLongG"></use>
        <use href="#ribShortG" transform="rotate(20 100 100)"></use>
        <use href="#ribLongG" transform="rotate(40 100 100)"></use>
        <use href="#ribShortG" transform="rotate(60 100 100)"></use>
        <use href="#ribLongG" transform="rotate(80 100 100)"></use>
        <use href="#ribShortG" transform="rotate(100 100 100)"></use>
        <use href="#ribLongG" transform="rotate(120 100 100)"></use>
        <use href="#ribShortG" transform="rotate(140 100 100)"></use>
        <use href="#ribLongG" transform="rotate(160 100 100)"></use>
        <use href="#ribShortR" transform="rotate(180 100 100)"></use>
        <use href="#ribLongR" transform="rotate(200 100 100)"></use>
        <use href="#ribShortR" transform="rotate(220 100 100)"></use>
        <use href="#ribLongR" transform="rotate(240 100 100)"></use>
        <use href="#ribShortR" transform="rotate(260 100 100)"></use>
        <use href="#ribLongR" transform="rotate(280 100 100)"></use>
        <use href="#ribShortR" transform="rotate(300 100 100)"></use>
        <use href="#ribLongR" transform="rotate(320 100 100)"></use>
        <use href="#ribShortR" transform="rotate(340 100 100)"></use>
      </g>
      <circle cx="100" cy="100" r="26" fill="url(#core)" filter="url(#soft)"></circle>
    </g>
  </defs>

  <g>
    <rect width="1400" height="420" fill="url(#bgBase)"></rect>
    <rect width="1400" height="420" fill="url(#bgLight)"></rect>
    <rect width="1400" height="420" fill="url(#bgTop)"></rect>
    <rect width="1400" height="420" fill="url(#bgFloor)"></rect>
  </g>

  <use href="#sun" transform="translate(228 210) scale(1.5104) translate(-100 -100)"></use>

  <text x="452" y="204" textLength="852" lengthAdjust="spacing" font-family="Jost, 'Century Gothic', Futura, sans-serif" font-weight="300" font-size="58" fill="url(#nameBlue)">CAIO GRACCO</text>
  <text x="455" y="262" textLength="430" lengthAdjust="spacing" font-family="'Cormorant Garamond', Garamond, Georgia, serif" font-style="italic" font-weight="300" font-size="28" fill="#B1477C">Terapias da Completude</text>
</svg>