<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel · Caio Gracco</title>
  <link rel="icon" href="/marca/favicon-32.png" />
  <!-- Caminho absoluto de propósito: a página é servida em /admin, sem barra
       no fim, e o caminho relativo iria parar em /config.yml. -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* Só a tela de entrada recebe a cara da marca. O resto do painel é o
       Decap, que tem visual próprio, consistente, e que não vale a pena
       reescrever: cada CSS nosso aqui dentro é uma coisa a quebrar quando o
       painel for atualizado. */
    body { background: #FAF5EC; }

    #boas-vindas {
      position: fixed; inset: 0 0 auto 0; z-index: 10;
      display: none; flex-direction: column; align-items: center;
      padding: 2.2rem 1.5rem 0; pointer-events: none;
      font-family: Jost, system-ui, sans-serif; text-align: center;
    }
    #boas-vindas.aparecer { display: flex; }
    #boas-vindas img { display: none; }  /* o Decap já mostra a marca */
    #boas-vindas h1 {
      margin: 1.1rem 0 0; font-family: Cinzel, Georgia, serif; font-weight: 600;
      font-size: 1.6rem; letter-spacing: .1em; color: #16324B;
    }
    #boas-vindas p {
      margin: .55rem 0 0; max-width: 27rem; font-size: 1rem;
      line-height: 1.55; color: #4C463D;
    }
    #boas-vindas small {
      margin-top: 1.6rem; font-size: .85rem; color: #5C554A;
    }
    @media (max-height: 620px) { #boas-vindas { padding-top: 1.5rem; } #boas-vindas img { width: 60px; height: 60px; } }
  </style>
</head>
<body>
  <div id="boas-vindas" aria-hidden="true">
    <img src="/marca/simbolo-256.webp" alt="" />
    <h1>PAINEL DO SITE</h1>
    <p>Aqui você escreve artigos, troca textos e fotos. O que for salvo entra no ar sozinho, em poucos minutos.</p>
    <small>Use a conta que foi criada para o site. O botão fica logo abaixo.</small>
  </div>
  <!-- O painel é servido do próprio site, e não de CDN.
       Pesa 5 MB, mas só carrega em /admin, e assim o Caio consegue editar o
       site mesmo que a CDN esteja fora do ar ou bloqueada na rede dele.
       A versão fica congelada: atualizar é trocar este arquivo de propósito,
       e não amanhecer com um painel diferente. Decap CMS 3.8.4. -->
  <script src="/admin/decap-cms.js"></script>
  <script>
    // A saudação aparece só na tela de entrada. Depois de entrar, o Decap
    // passa a usar o endereço com # e a tela vira o editor, onde um texto
    // fixo por cima só atrapalharia.
    (function () {
      var caixa = document.getElementById('boas-vindas')
      // Na tela de entrada o Decap deixa o endereço em '' ou '#/'. Depois de
      // entrar, ele passa a usar '#/collections/...'. É a diferença que serve
      // para saber em qual das duas telas estamos.
      function naEntrada () {
        var h = location.hash
        return h === '' || h === '#' || h === '#/'
      }
      function decidir () { caixa.classList.toggle('aparecer', naEntrada()) }
      decidir()
      window.addEventListener('hashchange', decidir)
      // Entrar não muda o endereço na hora; olhar de novo por alguns segundos
      // resolve sem observar a árvore inteira do painel.
      var conta = 0
      var relogio = setInterval(function () {
        decidir()
        if (++conta > 60) clearInterval(relogio)
      }, 500)
    })()
  </script>
</body>
</html>
