{
  "backend": {
    "name": "github",
    "repo": "advogado-cmd/caiogracco",
    "branch": "main",
    "base_url": "https://caiogracco.com.br",
    "auth_endpoint": "api/auth",
    "commit_messages": {
      "create": "Painel: novo {{collection}} \"{{slug}}\"",
      "update": "Painel: {{collection}} \"{{slug}}\" atualizado",
      "delete": "Painel: {{collection}} \"{{slug}}\" removido",
      "uploadMedia": "Painel: imagem {{path}} enviada",
      "deleteMedia": "Painel: imagem {{path}} removida"
    }
  },
  "locale": "pt",
  "media_folder": "public/enviados",
  "public_folder": "/enviados",
  "publish_mode": "simple",
  "site_url": "https://caiogracco.com.br",
  "logo_url": "/marca/simbolo-256.webp",
  "collections": [
    {
      "name": "blog",
      "label": "Blog",
      "label_singular": "artigo",
      "description": "Escrever, editar e despublicar artigos. O que sair daqui entra no site, no mapa do Google e na busca interna sozinho.",
      "folder": "src/content/blog",
      "create": true,
      "slug": "{{slug}}",
      "extension": "md",
      "format": "json-frontmatter",
      "frontmatter_delimiter": [
        "---json",
        "---"
      ],
      "sortable_fields": [
        "publicadoEm",
        "titulo"
      ],
      "view_filters": [
        {
          "label": "Publicados este ano",
          "field": "publicadoEm",
          "pattern": "2026"
        }
      ],
      "fields": [
        {
          "name": "titulo",
          "label": "Título",
          "widget": "string"
        },
        {
          "name": "tituloCurto",
          "label": "Título curto (cartões e menus)",
          "widget": "string",
          "required": false
        },
        {
          "name": "slug",
          "label": "Endereço",
          "widget": "string",
          "hint": "Só letras minúsculas e hífens. Não mude depois de publicado: quem já tem o link perde a página."
        },
        {
          "name": "resumo",
          "label": "Resumo (aparece no cartão)",
          "widget": "text"
        },
        {
          "name": "descricao",
          "label": "Descrição para o Google",
          "widget": "text",
          "hint": "Até 158 caracteres."
        },
        {
          "name": "categoria",
          "label": "Categoria",
          "widget": "select",
          "options": [
            {
              "label": "Osatoshi",
              "value": "osatoshi"
            },
            {
              "label": "Relacionamentos",
              "value": "relacionamentos"
            },
            {
              "label": "Família e filhos",
              "value": "familia"
            },
            {
              "label": "Amizades e convivência",
              "value": "convivencia"
            },
            {
              "label": "Dinheiro e prosperidade",
              "value": "prosperidade"
            },
            {
              "label": "Corpo e sintomas",
              "value": "corpo"
            },
            {
              "label": "Espiritualidade e emoções",
              "value": "espiritual"
            },
            {
              "label": "As práticas",
              "value": "praticas"
            },
            {
              "label": "Antes de começar",
              "value": "orientacao"
            }
          ]
        },
        {
          "name": "publicadoEm",
          "label": "Publicado em",
          "widget": "datetime",
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "picker_utc": true,
          "format": "YYYY-MM-DD"
        },
        {
          "name": "atualizadoEm",
          "label": "Atualizado em",
          "widget": "datetime",
          "required": false,
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "picker_utc": true,
          "format": "YYYY-MM-DD"
        },
        {
          "name": "terapias",
          "label": "Terapias relacionadas",
          "widget": "list",
          "required": false,
          "field": {
            "name": "slug",
            "label": "Endereço da terapia",
            "widget": "string"
          }
        },
        {
          "name": "palavrasChave",
          "label": "Palavras-chave",
          "widget": "list",
          "field": {
            "name": "palavra",
            "label": "Palavra",
            "widget": "string"
          }
        },
        {
          "name": "peso",
          "label": "Peso editorial",
          "widget": "number",
          "required": false,
          "value_type": "int",
          "hint": "Ordena a vitrine da home. Maior aparece antes."
        },
        {
          "name": "faq",
          "label": "Perguntas frequentes",
          "widget": "list",
          "required": false,
          "fields": [
            {
              "name": "pergunta",
              "label": "Pergunta",
              "widget": "string"
            },
            {
              "name": "resposta",
              "label": "Resposta",
              "widget": "text"
            }
          ]
        },
        {
          "name": "body",
          "label": "Texto do artigo",
          "widget": "markdown"
        }
      ]
    },
